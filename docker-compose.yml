services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ntp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntp_dev_only}
      POSTGRES_DB: ntp_audit
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ntp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntp -d ntp_audit"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  ntp_pgdata:
